  const card = view === "study" && !done ? SENTENCES[queue[pos]] : null;
  const sentence = useMemo(() => (card ? card.words.map((x) => x.t).join(" ") : ""), [card]);
  useEffect(() => { if (mode === "listen" && card && !revealed && !heard) { const t = setTimeout(() => { speak(sentence); setHeard(true); }, 350); return () => clearTimeout(t); } }, [card, mode, revealed, heard, sentence]);

  function onGrade(g) {
    const id = queue[pos]; const now = Date.now(); const upd = grade(cardState(id), g, now);
    const nc = Object.assign({}, store.cards); nc[id] = upd;
    persist(Object.assign({}, store, { cards: nc, streak: bumpStreak(store) }));
    setSDone((n) => n + 1);
    if (g === "again") { const q = queue.slice(); q.splice(pos, 1); q.splice(Math.min(pos + 3, q.length), 0, id); setQueue(q); setPos(pos); }
    else setPos(pos + 1);
    setRevealed(false); setHeard(false); setSelWord(null);
  }
  function markVocab(sp){ const v=Object.assign({},store.vocab); v[sp]=1; persist(Object.assign({},store,{vocab:v})); }
  function toggleVocab(sp){ const v=Object.assign({},store.vocab); if(v[sp])delete v[sp]; else v[sp]=1; persist(Object.assign({},store,{vocab:v})); }
  async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} setSession(null); setGate("auth"); }

  if (gate === "auth") return <Auth onSkip={() => setGate("app")} />;

  return (
    <div style={{ fontFamily: T.sans, background: T.surface, color: T.ink, minHeight: "100vh", padding: "18px 14px 46px" }}>
      <style>{`@media (prefers-reduced-motion: reduce){.flip{transition:none!important}} .flip{transition:opacity .28s} .tap:active{transform:scale(.98)} .wchip{cursor:pointer;border-bottom:2px dotted transparent} .wchip:hover{border-bottom-color:currentColor} .row:hover{background:#faf9fd} input{font-family:inherit}`}</style>
      <div style={{ maxWidth: 440, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontFamily: T.serif, fontSize: 26, cursor: "pointer" }} onClick={() => setView("home")}>hablas<span style={{ color: T.jade }}>·</span></div>
          <div style={{ fontSize: 12, color: T.inkSoft, textAlign: "right" }}>
            <div>Level A1 · Latin American</div>
            {CLOUD && session && <div style={{ fontSize: 11, marginTop: 2 }}>{syncMsg || session.user.email} · <span onClick={signOut} style={{ color: T.violet, cursor: "pointer" }}>sign out</span></div>}
            {CLOUD && !session && <div style={{ fontSize: 11, marginTop: 2 }}><span onClick={() => setGate("auth")} style={{ color: T.violet, cursor: "pointer" }}>sign in to sync</span></div>}
          </div>
        </div>
        {view === "home" && <Home stats={stats} covG={covG} covV={covV} store={store} cardState={cardState} onStudy={startStudy} onQuiz={() => setView("quiz")} onVocab={() => setView("vocab")} />}
        {view === "study" && card && <StudyCard mode={mode} card={card} sentence={sentence} revealed={revealed} selWord={selWord} unit={UNITS.find((u) => u.n === card.u)} pos={pos} total={queue.length} sDone={sDone} onBack={() => setView("home")} onReveal={() => { setRevealed(true); speak(sentence); }} onReplay={() => speak(sentence)} onWord={setSelWord} onCloseWord={() => setSelWord(null)} onGrade={onGrade} cardState={cardState} />}
        {view === "study" && done && <Complete sDone={sDone} mode={mode} onHome={() => setView("home")} />}
        {view === "quiz" && <Quiz onBack={() => setView("home")} onSeen={markVocab} />}
        {view === "vocab" && <VocabBrowser store={store} onToggle={toggleVocab} onBack={() => setView("home")} />}
      </div>
    </div>
  );
}

function Auth(props) {

        <button className="tap" onClick={go} disabled={busy} style={{ width: "100%", background: T.jade, color: "#fff", border: "none", borderRadius: 10, padding: "13px", fontSize: 15, fontWeight: 700, cursor: "pointer", marginTop: 6 }}>{busy ? "…" : mode === "signup" ? "Create account" : "Sign in"}</button>

        <div style={{ textAlign: "center", marginTop: 22 }}>
          <span onClick={onSkip} style={{ color: T.inkSoft, cursor: "pointer", fontSize: 13, borderBottom: `1px dotted ${T.inkSoft}` }}>Continue without an account</span>
        </div>
      </div>
    </div>
  );
}
const inp = { width: "100%", padding: "12px 14px", borderRadius: 10, border: `1px solid ${T.line}`, fontSize: 15, marginBottom: 10, fontFamily: T.sans };

            <div style={{ fontSize: 12, color: T.inkSoft, margin: "3px 0 8px" }}>{u.hint}</div>
            <div style={{ height: 5, background: T.line, borderRadius: 99, overflow: "hidden" }}><div style={{ width: (pct * 100) + "%", height: "100%", background: pct === 1 ? T.jade : T.amber }} /></div>

function StudyCard(props) {

  return (

      <div style={{ height: 6, background: T.line, borderRadius: 99, overflow: "hidden", marginBottom: 8 }}><div style={{ width: (progress * 100) + "%", height: "100%", background: T.jade, transition: "width .3s" }} /></div>
      <div style={{ fontSize: 11.5, color: T.inkSoft, marginBottom: 14 }}>{pos} / {total} done · {sDone} reviewed</div>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderLeft: `4px solid ${mode === "listen" ? T.violet : T.jade}`, borderRadius: 14, padding: 20, boxShadow: "0 1px 0 rgba(33,27,51,.04)" }}>
        <div style={{ fontSize: 11, color: T.inkSoft, marginBottom: 12, display: "flex", justifyContent: "space-between" }}><span style={{ background: T.violetSoft, color: T.violet, borderRadius: 99, padding: "2px 9px" }}>{card.tag}</span><span>{revealed ? "check yourself" : mode === "listen" ? "what did you hear?" : "produce it"}</span></div>

            {mode === "listen" && <div style={{ marginTop: 8, fontFamily: T.serif, fontSize: 16, color: T.inkSoft }}>{card.en}</div>}
            <div style={{ marginTop: 6, fontSize: 13, color: T.inkSoft }}>Tap any word · <span style={{ color: T.jade }}>green = verb</span></div>
            <button className="tap" onClick={onReplay} style={btn(T.jadeSoft, T.jade)}>▶ Hear it again</button>

function Quiz(props) {
  const { onBack, onSeen } = props;
  const qs = useMemo(() => { const picks = shuffle(VOCAB).slice(0, 10); return picks.map((v) => { const wrong = shuffle(VOCAB.filter((x) => x.sp !== v.sp)).slice(0, 3).map((x) => x.sp); return { en: v.en, sp: v.sp, options: shuffle([v.sp].concat(wrong)) }; }); }, []);
  const [i, setI] = useState(0); const [pick, setPick] = useState(null); const [score, setScore] = useState(0);
  const q = qs[i]; const finished = i >= qs.length;
  function choose(o) { if (pick) return; setPick(o); speak(q.sp); onSeen(q.sp); if (o === q.sp) setScore((s) => s + 1); }
  if (finished) return (
    <div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 14, padding: "26px 22px", textAlign: "center", marginTop: 16 }}>
      <div style={{ fontFamily: T.serif, fontSize: 24, marginBottom: 8 }}>{score}/{qs.length} correct</div>
      <div style={{ fontSize: 14, color: T.inkSoft }}>Recognition testing hits a different memory path than producing or hearing — using all three is what makes it stick.</div>
      <button className="tap" onClick={onBack} style={btn(T.ink, "#fff", true)}>Back to home</button>
    </div>
  );
  return (
    <div>
      <button onClick={onBack} className="tap" style={{ background: "none", border: "none", color: T.inkSoft, cursor: "pointer", fontSize: 13, padding: "4px 0" }}>← home</button>
      <div style={{ fontSize: 12, color: T.amber, fontWeight: 600, margin: "4px 0 12px" }}>Quiz · {i + 1} / {qs.length}</div>
      <div style={{ background: T.card, border: `1px solid ${T.line}`, borderLeft: `4px solid ${T.amber}`, borderRadius: 14, padding: 20 }}>
        <div style={{ fontSize: 13, color: T.inkSoft, marginBottom: 6 }}>Which word means…</div>
        <div style={{ fontFamily: T.serif, fontSize: 24, marginBottom: 16 }}>{q.en}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
          {q.options.map((o) => { let bg = "#fff", bd = T.line, col = T.ink; if (pick) { if (o === q.sp) { bg = T.jadeSoft; bd = T.jade; col = T.jade; } else if (o === pick) { bg = "#F7E7EA"; bd = T.rose; col = T.rose; } } return <button key={o} className="tap" onClick={() => choose(o)} style={{ textAlign: "left", background: bg, border: `1.5px solid ${bd}`, color: col, borderRadius: 10, padding: "12px 14px", fontSize: 17, fontFamily: T.serif, cursor: pick ? "default" : "pointer" }}>{o}</button>; })}
        </div>
        {pick && <button className="tap" onClick={() => { setPick(null); setI(i + 1); }} style={btn(T.ink, "#fff", true)}>{i + 1 >= qs.length ? "See score" : "Next →"}</button>}
      </div>
    </div>
  );
}

function VocabBrowser(props) {
  const { store, onToggle, onBack } = props;
  const [q, setQ] = useState("");
  const cats = useMemo(() => { const m = {}; VOCAB.forEach((v) => { if (q && !(v.sp.toLowerCase().indexOf(q.toLowerCase()) >= 0 || v.en.toLowerCase().indexOf(q.toLowerCase()) >= 0)) return; (m[v.cat] = m[v.cat] || []).push(v); }); return m; }, [q]);
  const seen = Object.keys(store.vocab || {}).length;
  return (
    <div>
      <button onClick={onBack} className="tap" style={{ background: "none", border: "none", color: T.inkSoft, cursor: "pointer", fontSize: 13, padding: "4px 0" }}>← home</button>
      <div style={{ fontSize: 13, color: T.inkSoft, margin: "4px 0 10px" }}>The A1 spine · {seen}/{VOCAB.length} marked · tap a word to hear it, tap the dot to mark it known</div>
      <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="search Spanish or English…" style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: `1px solid ${T.line}`, fontSize: 14, marginBottom: 14 }} />
      {Object.keys(cats).map((cat) => (

          <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 10, overflow: "hidden" }}>
            {cats[cat].map((v, i) => { const on = !!(store.vocab || {})[v.sp]; return (
              <div key={v.sp + i} className="row" style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", background: i % 2 ? "#fff" : T.surface, fontSize: 14 }}>
                <button onClick={() => onToggle(v.sp)} style={{ width: 18, height: 18, borderRadius: 99, border: `2px solid ${on ? T.jade : T.line}`, background: on ? T.jade : "#fff", cursor: "pointer", flexShrink: 0 }} />
                <span onClick={() => speak(v.sp)} style={{ fontFamily: T.serif, fontSize: 16, cursor: "pointer" }}>{v.sp}</span>
                <span style={{ color: T.inkSoft, fontSize: 13, marginLeft: "auto", textAlign: "right" }}>{v.en}</span>
              </div>); })}
          </div>
        </div>

      {!Object.keys(cats).length && <div style={{ color: T.inkSoft, fontSize: 14 }}>No matches.</div>}
    </div>
  );
}

function Breakdown(props) {
  const { word, onClose } = props;
  const [showConj, setShowConj] = useState(false);
  const clean = word.t.replace(/[¿?.,—!¡]/g, "").replace(/^—/, "");
  const isVerb = word.p === "verb" && word.verb && CONJ[word.verb.key];
  const c = isVerb ? CONJ[word.verb.key] : null;
  return (
    <div style={{ marginTop: 14, background: "#fff", border: `1px solid ${T.line}`, borderRadius: 14, padding: "16px 18px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div><div style={{ fontFamily: T.serif, fontSize: 23 }}>{clean}</div><div style={{ fontSize: 14, color: T.inkSoft, marginTop: 2 }}>{word.g}</div></div>
        <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, color: T.inkSoft, cursor: "pointer" }}>×</button>
      </div>
      {isVerb && (
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}><Tag>{c.eng}</Tag><Tag>{word.verb.tense}</Tag>{word.verb.person !== "—" && <Tag>{word.verb.person}</Tag>}</div>
          <button className="tap" onClick={() => setShowConj(!showConj)} style={{ marginTop: 12, background: "none", border: `1px solid ${T.line}`, borderRadius: 8, padding: "7px 11px", fontSize: 12.5, color: T.violet, cursor: "pointer", fontFamily: T.sans }}>{showConj ? "Hide" : "Show"} grammar — conjugate {word.verb.key} ▾</button>
          {showConj && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 8 }}><b style={{ color: T.jade }}>{c.pat}</b> · present tense (tap to hear):</div>
              <div style={{ border: `1px solid ${T.line}`, borderRadius: 10, overflow: "hidden" }}>
                {c.forms.map((row, i) => { const p = row[0], f = row[1]; const match = f.split(" ").pop() === clean.split(" ").pop(); return (
                  <div key={i} className="row" style={{ display: "flex", justifyContent: "space-between", padding: "7px 12px", background: i % 2 ? "#fff" : T.surface, fontSize: 14, cursor: "pointer" }} onClick={() => speak(f)}>
                    <span style={{ color: T.inkSoft }}>{p}</span><span style={{ fontFamily: T.serif, color: match ? T.jade : T.ink, fontWeight: match ? 700 : 400 }}>{f} ▸</span>
                  </div>); })}
              </div>
            </div>
          )}
        </div>
      )}
      {!isVerb && word.l && word.l !== clean.toLowerCase() && <div style={{ marginTop: 10, fontSize: 13, color: T.inkSoft }}>dictionary form <b style={{ color: T.ink }}>{word.l}</b></div>}
    </div>
  );
}

function Complete(props) {
  const { sDone, mode, onHome } = props;
  return (<div style={{ background: "#fff", border: `1px solid ${T.line}`, borderRadius: 14, padding: "26px 22px", textAlign: "center", marginTop: 16 }}>
    <div style={{ fontFamily: T.serif, fontSize: 24, marginBottom: 8 }}>¡Muy bien!</div>
    <div style={{ fontSize: 14, color: T.inkSoft, lineHeight: 1.5 }}>You worked through <b style={{ color: mode === "listen" ? T.violet : T.jade }}>{sDone}</b> cards. Your schedule is saved{CLOUD ? " and synced" : ""} — shaky ones return sooner, solid ones days out.</div>
    <button className="tap" onClick={onHome} style={btn(T.ink, "#fff", true)}>Back to home</button>
  </div>);
}

function Metric(props){ return <div style={{ flex: 1, background: "#fff", border: `1px solid ${T.line}`, borderRadius: 10, padding: "9px 10px" }}><div style={{ fontSize: 19, fontWeight: 700, color: props.c }}>{props.v}</div><div style={{ fontSize: 10.5, color: T.inkSoft, lineHeight: 1.2 }}>{props.l}</div></div>; }
function Tag(props){ return <span style={{ fontSize: 11.5, background: props.alt ? T.jadeSoft : T.violetSoft, color: props.alt ? T.jade : T.violet, borderRadius: 99, padding: "3px 9px" }}>{props.children}</span>; }
function Gr(props){ return <button className="tap" onClick={props.onClick} style={{ background: "#fff", border: `1.5px solid ${props.c}`, color: props.c, borderRadius: 10, padding: "10px 8px", cursor: "pointer", fontFamily: T.sans }}><div style={{ fontSize: 15, fontWeight: 700 }}>{props.label}</div><div style={{ fontSize: 10.5, opacity: .85 }}>{props.sub}</div></button>; }
function Big(props){ return <button className="tap" onClick={props.onClick} style={{ width: "100%", textAlign: "left", background: props.bg, color: "#fff", border: "none", borderRadius: 12, padding: "15px 18px", cursor: "pointer", fontFamily: T.sans, marginBottom: 10 }}><div style={{ fontSize: 16, fontWeight: 700 }}>{props.title}</div><div style={{ fontSize: 12, opacity: .9, marginTop: 2 }}>{props.sub}</div></button>; }
function btn(bg, fg, block){ return { marginTop: 16, width: block ? "100%" : "auto", background: bg, color: fg, border: "none", borderRadius: 10, padding: "13px 16px", fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: T.sans }; }

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
